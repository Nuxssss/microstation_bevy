[workspace]
resolver = "3"
members = ["microstation_bevy_client","microstation_bevy_server","microstation_bevy_shared"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
strip = true
panic = "abort"
codegen-units = 1
lto = "fat"
incremental = false
debug = false

[workspace.dependencies]
bevy = { version = "0.19.0", default-features = false }
bevy_replicon_renet = { version = "0.17.0", features = ["renet_netcode"] }
bevy_replicon = { version = "0.41.1", features = ["world_serialization", "scene"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2+spec-1.1.0"
phf = { version = "0.14.0", features = ["macros"] }
clap = { version = "4.6.1", features = ["derive"]}
serde_bytes = { version = "*" }
